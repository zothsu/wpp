name: Deploy to Hostinger

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm ci
      - run: npm run build
      - run: npm run split-deploy

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.HOSTINGER_SSH_KEY }}

      - name: Trust Hostinger host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.HOSTINGER_SSH_PORT }}" "${{ secrets.HOSTINGER_SSH_HOST }}" >> ~/.ssh/known_hosts

      # wildpear.school and enrolled.wildpear.school share one hosting account,
      # and enrolled/ is a SUBFOLDER of the main site's public_html/. The
      # --exclude flag on the main deploy is required: without it, --delete
      # would wipe out the enrolled portal every time the main site deploys.
      - name: Deploy main (wildpear.school)
        run: |
          rsync -avz --delete \
            --exclude=enrolled \
            -e "ssh -p ${{ secrets.HOSTINGER_SSH_PORT }}" \
            deploy/main/ u634839907@${{ secrets.HOSTINGER_SSH_HOST }}:domains/wildpear.school/public_html/

      - name: Deploy enrolled.wildpear.school
        run: |
          rsync -avz --delete \
            -e "ssh -p ${{ secrets.HOSTINGER_SSH_PORT }}" \
            deploy/enrolled/ u634839907@${{ secrets.HOSTINGER_SSH_HOST }}:domains/wildpear.school/public_html/enrolled/
