name: Deploy to Hostinger

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm ci
      - run: npm run build
        env:
          PUBLIC_RECAPTCHA_SITE_KEY: ${{ secrets.PUBLIC_RECAPTCHA_SITE_KEY }}
      - run: npm run split-deploy

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.HOSTINGER_SSH_KEY }}

      - name: Trust Hostinger host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.HOSTINGER_SSH_PORT }}" "${{ secrets.HOSTINGER_SSH_HOST }}" >> ~/.ssh/known_hosts

      # wildpear.school, enrolled.wildpear.school, and crm.wildpear.school all
      # share one hosting account and are SUBFOLDERS of the main site's
      # public_html/. Every one of them MUST be excluded here: without it,
      # --delete wipes that folder out on the next push to main (this is not
      # hypothetical - it happened to crm/ on 2026-08-12 because this list
      # wasn't updated when the CRM was set up). If another folder/subdomain
      # gets added under public_html/ in the future, add it here too.
      - name: Deploy main (wildpear.school)
        run: |
          rsync -avz --delete \
            --exclude=enrolled \
            --exclude=crm \
            -e "ssh -p ${{ secrets.HOSTINGER_SSH_PORT }}" \
            deploy/main/ u634839907@${{ secrets.HOSTINGER_SSH_HOST }}:domains/wildpear.school/public_html/

      - name: Deploy enrolled.wildpear.school
        run: |
          rsync -avz --delete \
            -e "ssh -p ${{ secrets.HOSTINGER_SSH_PORT }}" \
            deploy/enrolled/ u634839907@${{ secrets.HOSTINGER_SSH_HOST }}:domains/wildpear.school/public_html/enrolled/
